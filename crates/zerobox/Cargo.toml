[package]
name = "zerobox"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
name = "zerobox"
path = "src/lib.rs"

[[bin]]
name = "zerobox"
path = "src/main.rs"

[dependencies]
zerobox-network-proxy = { workspace = true }
zerobox-snapshot = { workspace = true }
zerobox-sandboxing = { workspace = true }
zerobox-protocol = { workspace = true }
zerobox-utils-absolute-path = { workspace = true }
zerobox-utils-rustls-provider = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["process", "rt-multi-thread", "macros", "io-util"] }
chrono = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
tabwriter = "1.4"
getrandom = "0.3"
rama-http = { version = "=0.3.0-alpha.4" }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zerobox-linux-sandbox = { workspace = true }
