# Release pipeline:
# 1. Push to main → changesets action opens "Version Packages" PR
# 2. Merge that PR → changesets action detects release, we tag
# 3. Tag push → new workflow run: build binaries, GitHub Release, npm publish

name: Release
permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  # ── Changesets: open version PR or detect published release ──
  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - id: changesets
        uses: changesets/action@v1
        with:
          # Version command: bump JS versions, then sync into Cargo.toml.
          version: pnpm run version
          publish: echo "skip-publish"
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Tag: create git tag after changesets merges the version PR ──
  tag:
    name: Tag Release
    needs: changesets
    if: needs.changesets.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create and push tag (if not already tagged)
        run: |
          VERSION=$(node -p "require('./packages/zerobox/package.json').version")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          echo "Tagging $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  # ══════════════════════════════════════════════════════════════
  # Everything below runs on tag push (separate workflow run)
  # ══════════════════════════════════════════════════════════════

  # ── Sync upstream Codex crates ──
  sync:
    name: Sync Upstream
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/sync.sh
      - uses: actions/upload-artifact@v4
        with:
          name: upstream
          path: upstream/
          retention-days: 1

  # ── Test before release ──
  test:
    name: Test before release
    needs: sync
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: upstream
          path: upstream/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p zerobox
      - name: Rust unit tests
        run: cargo test --workspace --lib
      - name: Rust E2E tests
        env:
          ZEROBOX_EXEC: ./target/release/zerobox
        run: cargo test -p zerobox --test sandbox_e2e
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - name: SDK build + test
        env:
          ZEROBOX_BIN: ${{ github.workspace }}/target/release/zerobox
        run: |
          pnpm --filter zerobox run build
          pnpm --filter zerobox run lint
          pnpm --filter zerobox run typecheck
          pnpm --filter zerobox run test

  # ── Build binaries for each platform ──
  build:
    name: Build (${{ matrix.target }})
    needs: [sync, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            packages: libcap-dev gcc-aarch64-linux-gnu
            cargo-linker: aarch64-linux-gnu-gcc
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            packages: libcap-dev
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            packages: musl-tools libcap-dev
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            packages: musl-tools gcc-aarch64-linux-gnu
            cargo-linker: aarch64-linux-gnu-gcc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: upstream
          path: upstream/
      - name: Install system deps
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Configure cross-linker
        if: matrix.cargo-linker
        run: |
          mkdir -p .cargo
          echo '[target.${{ matrix.target }}]' >> .cargo/config.toml
          echo 'linker = "${{ matrix.cargo-linker }}"' >> .cargo/config.toml
      - name: Build
        run: cargo build --profile dist --target ${{ matrix.target }} -p zerobox
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/dist/zerobox dist/zerobox
          tar czf dist/zerobox-${{ matrix.target }}.tar.gz -C dist zerobox
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/zerobox-${{ matrix.target }}.tar.gz

  # ── GitHub Release ──
  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts/
          merge-multiple: true
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*.tar.gz

  # ── Publish to crates.io ──
  publish-crate:
    name: Publish crate
    needs: [build, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: upstream
          path: upstream/
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libcap-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish -p zerobox
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # ── Publish to npm ──
  publish-npm:
    name: Publish npm
    needs: [build, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install
      - name: Build SDK
        run: pnpm --filter zerobox run build
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts/
          merge-multiple: true
      - name: Extract binaries into platform packages
        run: ./scripts/prepare-npm.sh artifacts/
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64 cli-linux-arm64-musl cli-linux-x64-musl; do
            pnpm publish "packages/$pkg" --access public --no-git-checks || true
          done
      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm publish packages/zerobox --access public --no-git-checks
