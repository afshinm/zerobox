# Release pipeline:
# 1. Push changeset to main → changesets action opens "Version Packages" PR
# 2. Merge that PR → changesets detects no changesets remain, version is new
# 3. Same run: sync → test → build → GitHub Release → publish npm + crates.io

name: Release
permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]

jobs:
  # ── Changesets: open version PR or detect release ──
  changesets:
    name: Changesets
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: echo "skip-publish"
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if release needed
        id: check
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./packages/zerobox/package.json').version")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $VERSION, will release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

  # ── Sync upstream Codex crates ──
  sync:
    name: Sync Upstream
    needs: changesets
    if: needs.changesets.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/sync.sh
      - uses: actions/upload-artifact@v4
        with:
          name: upstream
          path: upstream/
          retention-days: 1

  # ── Test before release ──
  test:
    name: Test before release
    needs: sync
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: upstream
          path: upstream/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p zerobox
      - name: Rust unit tests
        run: cargo test --workspace --lib
      - name: Rust E2E tests
        env:
          ZEROBOX_EXEC: ./target/release/zerobox
        run: cargo test -p zerobox --test sandbox_e2e
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - name: SDK build + test
        env:
          ZEROBOX_BIN: ${{ github.workspace }}/target/release/zerobox
        run: |
          pnpm --filter zerobox run build
          pnpm --filter zerobox run lint
          pnpm --filter zerobox run typecheck
          pnpm --filter zerobox run test

  # ── Build binaries for each platform ──
  build:
    name: Build (${{ matrix.target }})
    needs: [sync, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            packages: libcap-dev
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            packages: libcap-dev
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            packages: musl-tools
            musl-libcap: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            packages: musl-tools
            musl-libcap: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: upstream
          path: upstream/
      - name: Install system deps
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Build libcap for musl
        if: matrix.musl-libcap
        run: |
          LIBCAP_VERSION="2.75"
          curl -fsSL "https://mirrors.edge.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-${LIBCAP_VERSION}.tar.xz" -o libcap.tar.xz
          tar xJf libcap.tar.xz
          PREFIX="$(pwd)/libcap-musl"
          mkdir -p "$PREFIX/lib" "$PREFIX/include/sys" "$PREFIX/include/linux" "$PREFIX/lib/pkgconfig"
          make -C "libcap-${LIBCAP_VERSION}/libcap" -j"$(nproc)" CC=musl-gcc AR=ar RANLIB=ranlib
          cp "libcap-${LIBCAP_VERSION}/libcap/libcap.a" "$PREFIX/lib/"
          cp "libcap-${LIBCAP_VERSION}/libcap/include/uapi/linux/capability.h" "$PREFIX/include/linux/"
          cp "libcap-${LIBCAP_VERSION}/libcap/include/sys/capability.h" "$PREFIX/include/sys/"
          cat > "$PREFIX/lib/pkgconfig/libcap.pc" <<EOF
          prefix=$PREFIX
          libdir=\${prefix}/lib
          includedir=\${prefix}/include
          Name: libcap
          Description: Linux capabilities library
          Version: $LIBCAP_VERSION
          Libs: -L\${libdir} -lcap
          Cflags: -I\${includedir}
          EOF
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          # Make Linux kernel headers available to musl-gcc via -idirafter.
          # This keeps musl headers at higher priority, only falling back to
          # /usr/include for kernel-only headers (linux/sched.h, etc.).
          # cc-rs picks up target-specific CFLAGS from this env var.
          TARGET_CFLAGS=$(echo "${{ matrix.target }}" | tr '-' '_')
          echo "CFLAGS_${TARGET_CFLAGS}=-idirafter /usr/include" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --profile dist --target ${{ matrix.target }} -p zerobox
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/dist/zerobox dist/zerobox
          tar czf dist/zerobox-${{ matrix.target }}.tar.gz -C dist zerobox
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/zerobox-${{ matrix.target }}.tar.gz

  # ── GitHub Release ──
  github-release:
    name: GitHub Release
    needs: [changesets, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts/
          merge-multiple: true
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.changesets.outputs.version }}" \
            --title "v${{ needs.changesets.outputs.version }}" \
            --generate-notes \
            artifacts/*.tar.gz

  # ── Publish to crates.io ──
  publish-crate:
    name: Publish crate
    needs: [build, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: upstream
          path: upstream/
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libcap-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish -p zerobox
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # ── Publish to npm ──
  publish-npm:
    name: Publish npm
    needs: [build, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install
      - name: Build SDK
        run: pnpm --filter zerobox run build
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts/
          merge-multiple: true
      - name: Extract binaries into platform packages
        run: ./scripts/prepare-npm.sh artifacts/
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64 cli-linux-arm64-musl cli-linux-x64-musl; do
            pnpm publish "packages/$pkg" --access public --no-git-checks || true
          done
      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm publish packages/zerobox --access public --no-git-checks
