[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # hickory-proto 0.25.2 advisories. Pinned by rama-dns 0.3.0-alpha.4 ->
    # rama-tcp -> rama-http-backend/rama-socks5 -> zerobox-network-proxy. The
    # zerobox proxy uses hickory for DNS resolution; risk is bounded to DoS-via-
    # malicious-upstream-DNS-response (unbounded NSEC3 loop) and CPU exhaustion
    # during name compression. Remove both entries once rama bumps hickory to
    # >=0.26.1.
    "RUSTSEC-2026-0118", # NSEC3 closest-encloser proof validation unbounded loop
    "RUSTSEC-2026-0119", # O(n^2) name compression in BinEncoder
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
