[workspace]
members = [
    "upstream/sandboxing",
    "upstream/linux-sandbox",
    "upstream/windows-sandbox-rs",
    "upstream/process-hardening",
    "upstream/utils/absolute-path",
    "upstream/utils/string",
    "upstream/utils/pty",
    "crates/zerobox-home-dir",
    "upstream/utils/rustls-provider",
    "upstream/network-proxy",

    "crates/zerobox",
    "crates/zerobox-snapshot",
    "crates/zerobox-protocol",
]
resolver = "2"

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/afshinm/zerobox"
homepage = "https://github.com/afshinm/zerobox"
description = "Sandbox any command with file, network, and credential controls."
keywords = ["security", "sandbox", "secret-management", "ai-agents", "process-isolation"]
categories = ["command-line-utilities", "os"]

[workspace.dependencies]
zerobox-linux-sandbox = { version = "=0.2.4", path = "upstream/linux-sandbox" }
zerobox-process-hardening = { version = "=0.2.4", path = "upstream/process-hardening" }
zerobox-protocol = { version = "=0.2.4", path = "crates/zerobox-protocol" }
zerobox-sandboxing = { version = "=0.2.4", path = "upstream/sandboxing" }
zerobox-windows-sandbox = { version = "=0.2.4", path = "upstream/windows-sandbox-rs" }
zerobox-utils-absolute-path = { version = "=0.2.4", path = "upstream/utils/absolute-path" }
zerobox-utils-pty = { version = "=0.2.4", path = "upstream/utils/pty" }
zerobox-utils-string = { version = "=0.2.4", path = "upstream/utils/string" }
zerobox-utils-home-dir = { version = "=0.2.4", path = "crates/zerobox-home-dir" }
zerobox-network-proxy = { version = "=0.2.4", path = "upstream/network-proxy" }
zerobox-snapshot = { version = "=0.2.4", path = "crates/zerobox-snapshot" }
zerobox-utils-rustls-provider = { version = "=0.2.4", path = "upstream/utils/rustls-provider" }

anyhow = "1"
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = "0.4.43"
clap = "4"
dirs = "6"
dunce = "1.0.4"
globset = "0.4"
landlock = "0.4.4"
lazy_static = "1"
libc = "0.2.182"
log = "0.4"
lru = "0.16.3"
path-absolutize = "3.1.1"
portable-pty = "0.9.0"
pretty_assertions = "1.4.1"
regex-lite = "0.1.8"
schemars = "0.8.22"
seccompiler = "0.5.0"
serde = "1"
serde_json = "1"
sha1 = "0.10.6"
strum = "0.27.2"
strum_macros = "0.28.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
time = "0.3"
tokio = "1"
tracing = "0.1"
ts-rs = "11"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
which = "8"

[workspace.lints]
rust = {}

[workspace.lints.clippy]
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[profile.dist]
inherits = "release"
lto = "thin"
